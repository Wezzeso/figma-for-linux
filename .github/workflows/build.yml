name: Build Linux packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev desktop-file-utils
      - name: Check launcher and native cursor
        run: |
          python3 -m unittest discover -s tests -v
          bash -n install.sh bin/figma-for-linux
          python3 -m compileall -q app scripts
      - name: Build verified packages
        run: python3 scripts/build.py
      - name: Validate desktop entry and checksums
        run: |
          desktop-file-validate build/deb-root/usr/share/applications/figma-for-linux.desktop
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: figma-for-linux-x86_64
          path: dist/*
          if-no-files-found: error
